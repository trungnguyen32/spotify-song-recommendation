name: Data contracts
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pandas==3.0.3 numpy==2.5.1
      - run: python -m unittest discover -s tests -v
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: spotify_test
          POSTGRES_USER: spotify
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spotify -d spotify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPOTIFY_TEST_DATABASE_URL: postgresql://spotify:ci-only-password@localhost:5432/spotify_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pandas==3.0.3 numpy==2.5.1 "psycopg[binary]>=3.2,<4"
      - run: python -m unittest discover -s tests -v
